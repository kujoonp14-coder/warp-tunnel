name: Build Android APKs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ----------------------------------------------------
      # 1. Read version from config/version
      # ----------------------------------------------------
      - name: Read Version from config/version
        id: read_version
        run: |
          if [ -f "config/version" ]; then
            VERSION=$(cat config/version | tr -d '[:space:]')
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Read version: $VERSION"
          else
            echo "⚠️ config/version file not found! Using default version 1.0.0"
            echo "VERSION=1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Validate or Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew
        
      - name: Build Release APKs
        run: ./gradlew assembleRelease --no-daemon
        
      - name: Sign APKs with Keystore
        uses: r3d-act/signed-build-action@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # ----------------------------------------------------
      # 4. Rename APKs to warptunnel-{version}-{arch}.apk
      # ----------------------------------------------------
      - name: Rename APKs to WarpTunnel Format
        run: |
          cd app/build/outputs/apk/release/
          VERSION="${{ steps.read_version.outputs.VERSION }}"
          
          # Rename each APK
          for file in *.apk; do
            # Skip if already renamed
            if [[ "$file" == warptunnel-* ]]; then
              continue
            fi
            
            if [[ "$file" == *"arm64-v8a"* ]]; then
              mv "$file" "warptunnel-v${VERSION}-arm64-v8a.apk"
            elif [[ "$file" == *"armeabi-v7a"* ]]; then
              mv "$file" "warptunnel-v${VERSION}-armeabi-v7a.apk"
            elif [[ "$file" == *"x86_64"* ]] || [[ "$file" == *"x86-64"* ]]; then
              mv "$file" "warptunnel-v${VERSION}-x86_64.apk"
            elif [[ "$file" == *"universal"* ]]; then
              mv "$file" "warptunnel-v${VERSION}-universal.apk"
            elif [[ "$file" == *"x86"* ]] && [[ ! "$file" == *"x86_64"* ]]; then
              mv "$file" "warptunnel-v${VERSION}-x86.apk"
            else
              # Default rename
              mv "$file" "warptunnel-v${VERSION}-${file}"
            fi
          done
          
          # List renamed files
          ls -la

      # ----------------------------------------------------
      # 5. Remove original app-*.apk files
      # ----------------------------------------------------
      - name: Remove Original APK Files
        run: |
          cd app/build/outputs/apk/release/
          rm -f app-*.apk
          echo "Remaining APK files:"
          ls -la warptunnel-*.apk

      # ----------------------------------------------------
      # 6. Upload Artifacts
      # ----------------------------------------------------
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WarpTunnel-APKs
          path: app/build/outputs/apk/release/warptunnel-*.apk
          retention-days: 30

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: warptunnel-arm64-v8a
          path: app/build/outputs/apk/release/warptunnel-*-arm64-v8a.apk
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: warptunnel-armeabi-v7a
          path: app/build/outputs/apk/release/warptunnel-*-armeabi-v7a.apk
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: warptunnel-x86_64
          path: app/build/outputs/apk/release/warptunnel-*-x86_64.apk
          retention-days: 30

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: warptunnel-x86
          path: app/build/outputs/apk/release/warptunnel-*-x86.apk
          retention-days: 30

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: warptunnel-universal
          path: app/build/outputs/apk/release/warptunnel-*-universal.apk
          retention-days: 30

      # ----------------------------------------------------
      # 7. Upload to GitHub Releases
      # ----------------------------------------------------
      - name: Upload WarpTunnel APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v${{ steps.read_version.outputs.VERSION }}"
          name: "v${{ steps.read_version.outputs.VERSION }}"
          body: |
            ### 🔥 WARP TUNNEL Android APK Builds
            
            | Architecture | Download | Size |
            | --- | --- | --- |
            | **ARM64-v8a** (64-bit) | [warptunnel-${{ steps.read_version.outputs.VERSION }}-arm64-v8a.apk]() | ~9.18 MB |
            | **ARMv7-a** (32-bit) | [warptunnel-${{ steps.read_version.outputs.VERSION }}-armeabi-v7a.apk]() | ~8.64 MB |
            | **x86_64** (64-bit) | [warptunnel-${{ steps.read_version.outputs.VERSION }}-x86_64.apk]() | ~9.32 MB |
            | **x86** (32-bit) | [warptunnel-${{ steps.read_version.outputs.VERSION }}-x86.apk]() | ~8.65 MB |
            | **Universal** (All) | [warptunnel-${{ steps.read_version.outputs.VERSION }}-universal.apk]() | ~17.2 MB |
            
            ---
            
            ### 📱 Installation Instructions
            1. Download the APK for your device architecture
            2. Enable "Install from Unknown Sources" in Settings
            3. Install and enjoy! 🚀
            
            ---
            
            ### ⚡ Features
            - ✅ WireGuard-based WARP VPN
            - ✅ Auto-config from Cloudflare API
            - ✅ Custom DNS support (Cloudflare/Google)
            - ✅ Dark Mode support
            - ✅ Auto-ping monitoring
            - ✅ Multiple server config support
            
            ---
            
            ### 📝 Changelog
            - Initial release
            - Fixed config parsing issues
            - Added fallback API support
            - Optimized APK sizes
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/warptunnel-*.apk

      # ----------------------------------------------------
      # 8. GitHub Actions Summary
      # ----------------------------------------------------
      - name: Generate APK Summary
        run: |
          echo "### 📦 WARP TUNNEL - Built APK Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.read_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | File Name | Size | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          
          cd app/build/outputs/apk/release/
          
          for file in warptunnel-*.apk; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              filesize=$(du -h "$file" | cut -f1)
              sha256=$(sha256sum "$file" | cut -d' ' -f1 | cut -c1-16)
              
              if [[ "$file" == *"arm64-v8a"* ]]; then
                arch="🟢 ARM64-v8a"
              elif [[ "$file" == *"armeabi-v7a"* ]]; then
                arch="🟡 ARMv7-a"
              elif [[ "$file" == *"x86_64"* ]]; then
                arch="🔵 x86_64"
              elif [[ "$file" == *"universal"* ]]; then
                arch="🟣 Universal"
              elif [[ "$file" == *"x86"* ]]; then
                arch="🟠 x86"
              else
                arch="⚪ Other"
              fi
              
              echo "| $arch | \`$filename\` | $filesize | \`$sha256...\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All APKs are available as downloadable artifacts in this workflow run." >> $GITHUB_STEP_SUMMARY

      - name: Build Completion Status
        run: |
          echo "### ✅ Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.read_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**APK Count:** $(ls -1 app/build/outputs/apk/release/warptunnel-*.apk 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Total Size:** $(du -sh app/build/outputs/apk/release/ | cut -f1)" >> $GITHUB_STEP_SUMMARY

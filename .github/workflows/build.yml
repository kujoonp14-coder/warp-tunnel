name: Build & Sign Android APKs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Version ကို config/version ဖိုင်မှ ဖတ်ခြင်း
      - name: Read Version from config/version
        id: read_version
        run: |
          if [ -f "config/version" ]; then
            VERSION=$(cat config/version | tr -d '[:space:]')
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      # 2. APK Build လုပ်ခြင်း (Debug mode ဖြင့် build သော်လည်း sign ပြန်လုပ်မည်)
      - name: Build Debug APKs
        run: ./gradlew assembleDebug --no-daemon

      # 3. APK များကို သင်၏ Keystore ဖြင့် Sign လုပ်ခြင်း
      - name: Sign APKs
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # 4. Sign ပြီးသား APK များကို သတ်မှတ်ထားသော Format အတိုင်း နာမည်ပြောင်းခြင်း
      - name: Rename Signed APKs to WarpTunnel Format
        run: |
          cd app/build/outputs/apk/debug/
          VERSION="${{ steps.read_version.outputs.VERSION }}"
          
          # Sign ပြီးသား (-signed.apk) ဖိုင်များကိုပဲ ရွေးထုတ်ပြီး rename လုပ်မည်
          for file in *-signed.apk; do
            [ -f "$file" ] || continue
            
            if [[ "$file" == *"arm64-v8a"* ]]; then
              mv "$file" "warptunnel-v${VERSION}-arm64-v8a.apk"
            elif [[ "$file" == *"armeabi-v7a"* ]]; then
              mv "$file" "warptunnel-v${VERSION}-armeabi-v7a.apk"
            elif [[ "$file" == *"x86_64"* ]]; then
              mv "$file" "warptunnel-v${VERSION}-x86_64.apk"
            elif [[ "$file" == *"universal"* ]]; then
              mv "$file" "warptunnel-v${VERSION}-universal.apk"
            elif [[ "$file" == *"x86"* ]]; then
              mv "$file" "warptunnel-v${VERSION}-x86.apk"
            else
              mv "$file" "warptunnel-v${VERSION}-${file%-signed.apk}.apk"
            fi
          done
          
          # မလိုအပ်သော မူရင်း (unsigned) APK များကို ဖျက်ပစ်မည်
          rm -f app-*.apk
          ls -la warptunnel-*.apk

      # 5. Artifacts များအဖြစ် သိမ်းဆည်းခြင်း
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WarpTunnel-Signed-APKs
          path: app/build/outputs/apk/debug/warptunnel-*.apk
          retention-days: 30

      # 6. GitHub Release တင်ခြင်း
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v${{ steps.read_version.outputs.VERSION }}"
          name: "v${{ steps.read_version.outputs.VERSION }}"
          body: |
            ### 🚀 WARP TUNNEL Official Signed Release
            - Version: ${{ steps.read_version.outputs.VERSION }}
            - Fixed: Hardware ID issue on Android 10+
            - Feature: Consistent Signing for easy updates
            
            Note: အရင် version အဟောင်းရှိနေပါက တစ်ကြိမ်သာ ဖျက်ပြီး ပြန်သွင်းပေးပါ။ နောက်ပိုင်း update များတွင် ဖျက်ရန် မလိုတော့ပါ။
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/warptunnel-*.apk

      # 7. Build Summary ထုတ်ပြန်ခြင်း
      - name: Generate Summary
        run: |
          echo "### ✅ Signed Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.read_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | File Name |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          cd app/build/outputs/apk/debug/
          for file in warptunnel-*.apk; do
            echo "| $(basename $file | cut -d'-' -f3) | \`$file\` |" >> $GITHUB_STEP_SUMMARY
          done
